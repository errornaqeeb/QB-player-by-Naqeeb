name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.9.1-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.9.1-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.1
          name: "QB Player v1.9.1 by Naqeeb (MKV Seeking via Local HTTP Server with Range Support)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.9.1 (Ad-Free Android APK)

            ### 🚀 Fixed MKV Seeking (Double-Tap 10s & Timeline Scrubber):
            - **100% Fixed MKV / WebM Seeking from Snapping to Beginning (0:00)**:
              - Exoplayer streams via local high-performance HTTP server (`127.0.0.1:8998`) with full HTTP Range request (`Accept-Ranges: bytes`, `206 Partial Content`) and exact `Content-Length` headers.
              - MatroskaExtractor can now seek to the end of MKV files to read Cues/Index tables, enabling accurate seeking on all MKV video files.
              - Suffix byte ranges and Scoped Storage file size fallbacks fully handled.
            - **Retained All Core MX Player Features**:
              - Instant folder browsing & video playback.
              - Multi-audio & dual-audio switching (Hindi, English, etc.).
              - Embedded & external subtitle support.
              - Center tap play/pause, edge tap controls toggle.
              - Volume & brightness swipe gestures.
              - 100% ad-free experience.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.9.1-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy full ad-free video watching!
          files: build-output/QB-Player-v1.9.1-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
