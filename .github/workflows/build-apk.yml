name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.1-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.1-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "QB Player v1.1.0 by Naqeeb (Ad-Free APK)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.1.0 (Ad-Free Android APK)
            
            This release brings full parity with MX Player:
            
            ### 🚀 New in v1.1.0:
            - **MX Player Folders Browser**: Scans device storage and automatically lists video folders (Download, Movies, Camera, WhatsApp, etc.) with video counts, size, and duration! Tap any video to play instantly — no gallery or file picker needed!
            - **Screen Rotation & Rotation Lock**: Dedicated rotation button + automatic movie landscape mode!
            - **Fixed Touch & Pause**: Tapping the screen while playing now pauses properly without disappearing controls. Controls stay visible while paused!
            - **Center Play/Pause Button**: Added large MX Player center button for effortless one-tap pause.
            
            ### 📲 How to Install:
            1. Download `QB-Player-v1.1-Naqeeb.apk` below onto your Android phone or Oppo Pad.
            2. Tap the downloaded APK to install/update.
            3. Enjoy full ad-free media playback!
          files: build-output/QB-Player-v1.1-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
