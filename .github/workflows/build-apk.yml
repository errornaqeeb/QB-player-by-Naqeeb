name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.9-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.9-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.0
          name: "QB Player v1.9.0 by Naqeeb (Full MKV Hardware Seeking & Timeline Fix)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.9.0 (Ad-Free Android APK)

            ### 🚀 Fixed MKV Seeking (Double-Tap 10s & Timeline Scrubber):
            - **100% Fixed MKV / WebM Seeking from Snapping to Beginning (0:00)**:
              - Direct File URI resolution (`Uri.fromFile`) allows ExoPlayer to read the Cues index located at the end of the MKV file directly via fast kernel random access.
              - Implemented custom `SeekableContentDataSource` that resolves true file size (`statSize` / `channel.size()`) and enables arbitrary byte channel positioning for `content://` MediaStore URIs.
              - Enabled `android:requestLegacyExternalStorage="true"` and `MANAGE_EXTERNAL_STORAGE` permission for full storage access.
              - Multi-tap double-tap accumulator prevents stale position resets during rapid seeking.
            - **Retained All Core MX Player Features**:
              - Instant folder browsing & video playback.
              - Crystal clear hardware video rendering (no black screens).
              - Multi-audio & dual-audio switching (Hindi, English, etc.).
              - Center tap play/pause, edge tap controls toggle.
              - Volume & brightness swipe gestures.
              - 100% ad-free experience.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.9-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy full ad-free video watching!
          files: build-output/QB-Player-v1.9-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
