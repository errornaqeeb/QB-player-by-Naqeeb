name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.7-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.7-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.0
          name: "QB Player v1.7.0 by Naqeeb (Timeline Slider & Seeking Fix)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.7.0 (Ad-Free Android APK)

            ### 🚀 Updates & Slider Timeline Fix:
            - **100% Fixed Video Timeline Slider / Progress Bar Seeking**:
              - Tapping or dragging anywhere on the timeline slider now seeks directly and accurately to that exact timestamp instead of jumping back to 0:00.
              - Connected native ExoPlayer duration and position synchronization seamlessly into `PlayerCore.getDuration()`.
              - Added smooth pointer capture and responsive scrubber handle for touchscreens on phones and tablets (Oppo Pad).
            - **Retained All v1.6.0 Functionality**:
              - Fast folder browsing & opening.
              - Full hardware-accelerated video rendering (no black screens).
              - Instant dual audio track selection & switching.
              - Double-tap left/right 10s skip.
              - Center tap play/pause, left/right edge controls toggle.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.7-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy full ad-free video watching!
          files: build-output/QB-Player-v1.7-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
