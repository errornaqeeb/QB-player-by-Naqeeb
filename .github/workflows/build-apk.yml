name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.2-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.2-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "QB Player v1.2.0 by Naqeeb (Ad-Free APK - Audio Fix)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.2.0 (Ad-Free Android APK)

            ### 🔊 Audio Fix & Quality Improvements in v1.2.0:
            - **Fixed Audio Silence**: Restored direct native hardware audio decoding through Android OS AudioTrack/MediaCodec. All videos now play with full, crystal-clear sound!
            - **Hardware Volume Sync**: Physical volume rocker buttons and right-side swipe gestures now directly adjust Android `AudioManager.STREAM_MUSIC` system media volume.
            - **Local Streaming Server Fix**: Added full CORS headers (`Access-Control-Allow-Origin: *`), real MIME type detection per file, exact `FileChannel` positioning, and `OPTIONS`/`HEAD` request handling.
            - **MX Player Folders Browser**: Automatic scanning of `Download`, `Movies`, `Camera`, `WhatsApp`, etc.
            - **Screen Rotation & Touch-to-Pause**: Instant pause on screen tap, controls stay visible while paused.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.2-Naqeeb.apk` below onto your Android phone or Oppo Pad.
            2. Tap the downloaded APK to install/update.
            3. Enjoy full ad-free media playback with full audio!
          files: build-output/QB-Player-v1.2-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
