name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.6-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.6-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.0
          name: "QB Player v1.6.0 by Naqeeb (Folder Navigation, Video Visibility & Dual Audio Fix)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.6.0 (Ad-Free Android APK)

            ### 🚀 Complete Video Playback & Dual Audio Fixes:
            - **100% Fixed Folder Opening**:
              - Fixed method naming mismatch between JavaScript (`getVideosInFolder`) and Android (`getFolderVideos`), allowing folders to open and show all contained videos immediately upon click.
            - **100% Fixed Black Screen during Video Playback**:
              - Resolved WebView alpha transparency overlay bug (`setLayerType(View.LAYER_TYPE_NONE)` and transparent root `<html>`/`<body>`/`#player-container`).
              - Removed black shutter cover on `PlayerView` with `app:shutter_background_color="@android:color/transparent"`.
              - Hardware ExoPlayer video now renders visibly with crystal clarity underneath the ad-free controls.
            - **100% Fixed Dual Audio Track Recognition & Instant Switching**:
              - Resolved `IllegalStateException` on `player.getCurrentTracks()` caused by cross-thread calls from the `JavaBridge` background thread.
              - Tracks are now automatically extracted on the UI thread when ExoPlayer loads media and cached safely.
              - All embedded audio streams (Track 1, Track 2, Hindi, English, 5.1 Surround, etc.) are detected and listed in the Audio modal.
              - Tapping any audio track switches audio streams instantly in 0ms without restarting or desynchronizing the video.
            - **Fixed Touch Controls & Gestures**:
              - Center tap pauses/plays video.
              - Left/Right edge taps show/hide controls.
              - Vertical drag controls Brightness & Volume with HW+ 200% boost.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.6-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy full ad-free video watching!
          files: build-output/QB-Player-v1.6-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
