name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.8-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.8-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.0
          name: "QB Player v1.8.0 by Naqeeb (Full MKV/All Formats Seeking & Progress Support)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.8.0 (Ad-Free Android APK)

            ### 🚀 Complete Multi-Format Support (MKV, WebM, MP4, AVI, TS, MOV, etc.):
            - **100% Fixed MKV & Multi-Format Seeking & Progress Bar**:
              - Added `DefaultExtractorsFactory` with constant bitrate seeking enabled (`setConstantBitrateSeekingEnabled(true)`).
              - Configured `SeekParameters.CLOSEST_SYNC` for instant, lag-free keyframe seeking across all container formats.
              - Implemented dynamic MIME type auto-detection (`video/x-matroska`, `video/webm`, `video/mp2t`, `video/x-msvideo`, etc.) for direct ExoPlayer container mapping.
              - Added multi-layered fallback duration parsing (`MediaStore` and `MediaMetadataRetriever`) so MKV files without upfront Cues index accurately display progress and allow full slider and double-tap seeking.
              - Added `onTimelineChanged` listener to capture asynchronous duration resolution in progressive media streams.
            - **Retained All Previous Features**:
              - Working folder navigation & video listing.
              - Full hardware ExoPlayer video rendering (crystal clear, no black screen).
              - Multi-audio & dual-audio switching (Hindi, English, 5.1 Surround, etc.).
              - Screen gestures: center tap play/pause, edge tap options toggle, volume & brightness vertical swipe.
              - Double-tap 10-second skip & smooth timeline scrubber.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.8-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy full ad-free video watching!
          files: build-output/QB-Player-v1.8-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
