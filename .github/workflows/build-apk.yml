name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.3-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.3-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "QB Player v1.3.0 by Naqeeb (Tap Zones, Dual Audio & Subtitles)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.3.0 (Ad-Free Android APK)

            ### 🚀 What's New & Fixed in v1.3.0:
            - **Center Screen Play/Pause & Edge Show/Hide Options**:
              - Tapping the **center zone** of the screen toggles Play/Pause.
              - Tapping the **left or right edge zones** only shows/hides playback options without pausing or playing the video.
            - **Dual & Multi-Audio Track Recognition & Switching**:
              - Powered by native Android `MediaExtractor` & `MediaMuxer`.
              - Automatically recognizes all embedded audio tracks (e.g., Hindi, English, 5.1 Surround, Stereo) in dual-audio MKV and MP4 videos.
              - Switch audio tracks on-the-fly directly from the Audio menu without losing playback sync!
            - **Embedded & Companion Subtitles Auto-Detection**:
              - Automatically parses embedded subtitle tracks inside MKV/MP4 containers.
              - Scans the video folder for companion `.srt`, `.vtt`, and `.ass` subtitle files matching the video name.
              - Automatically displays the first subtitle track on video start, with track selection and subtitle toggle (Off/On) in the Subtitle menu.
            - **All Previous MX Player Features Preserved**:
              - Ad-Free playback guarantee (no pause ads, no banner ads, no popups).
              - Device folder & video browser (Downloads, Movies, Camera, WhatsApp, etc.).
              - Screen rotation toggle and auto-landscape orientation.
              - "Play Where Left" resume playback prompt.
              - HW+ 200% Audio Boost & Equalizer.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.3-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy 100% ad-free video watching!
          files: build-output/QB-Player-v1.3-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
