name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.5-Naqeeb.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.5-Naqeeb.apk
          retention-days: 30

      - name: Create or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "QB Player v1.5.0 by Naqeeb (Responsiveness & Media Library Startup Fix)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.5.0 (Ad-Free Android APK)

            ### 🚀 Responsiveness, Media Folders & Startup Crash Fixes:
            - **100% Fixed Button Responsiveness & Frozen UI**:
              - Resolved syntax error in `js/app.js` caused by duplicated subtitle code that prematurely terminated the DOM initialization callback.
              - All event listeners, tab buttons, folder items, player controls, and gestures now register and respond instantly with zero lag.
            - **Fixed Storage Permission Request Threading**:
              - Android permissions (`READ_MEDIA_VIDEO` on Android 13+ and `READ_EXTERNAL_STORAGE` on older Android) are now dispatched strictly on the UI thread, eliminating background `JavaBridge` thread crashes.
              - Automatically displays a permission request dialog and refreshes video folders immediately when granted.
            - **Startup Blank Screen Fix**:
              - Cleaned folder browser view IDs and added responsive fallback cards.
              - `PlayerView` is now kept hidden (`View.GONE`) until playback actually begins, preventing any touch focus stealing.
            - **Native Google ExoPlayer Hardware Engine**:
              - Full Dolby AC3/E-AC3/DTS/AAC hardware audio decoding with crystal-clear sound.
              - Instant 0ms Dual Audio track switching with perfect lip-sync.
              - Automatic Matroska (MKV) & MP4 embedded subtitle detection and high-contrast rendering.
              - HW+ 200% Loudness Enhancer booster.
              - MX Player touch zones: center tap plays/pauses, edge taps toggle options.

            ### 📲 How to Install:
            1. Download `QB-Player-v1.5-Naqeeb.apk` below onto your Android mobile or Oppo Pad.
            2. Open the APK file to update / install.
            3. Enjoy full ad-free video watching!
          files: build-output/QB-Player-v1.5-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
