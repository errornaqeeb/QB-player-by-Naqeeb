name: Build Android APK (QB Player)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json service-worker.js css js assets android/app/src/main/assets/

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK with Gradle
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/QB-Player-v1.0-Naqeeb.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QB-Player-APK
          path: build-output/QB-Player-v1.0-Naqeeb.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "QB Player v1.0.0 by Naqeeb (Ad-Free APK)"
          body: |
            ## 🎬 QB Player by Naqeeb v1.0.0 (Ad-Free Android APK)
            
            This is the official Android APK for **Mobile** and **Oppo Pad / Tablets**.
            
            ### ✨ Included Features:
            - **Zero Ads**: Completely ad-free pause & unpause experience.
            - **MX Player Gestures**: Swipe left for Brightness, swipe right for Volume, swipe horizontal to Seek.
            - **200% Audio Boost**: Web Audio Gain booster with dynamic compressor.
            - **Subtitles Sync**: Real-time SRT/VTT/ASS sync offset and size customization.
            - **Dual Audio**: Multiple audio streams & external audio dub loader.
            - **Play Where Left**: Remembers exact playback position and history.
            - **Tablet & Oppo Pad Support**: Large screen responsive layout & Picture-in-Picture.
            
            ### 📲 Installation Instructions:
            1. Download `QB-Player-v1.0-Naqeeb.apk` below directly onto your Android phone or Oppo Pad.
            2. Tap the downloaded file to install. (If prompted, enable *"Install from Unknown Sources"*).
            3. Enjoy full ad-free media playback!
          files: build-output/QB-Player-v1.0-Naqeeb.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
